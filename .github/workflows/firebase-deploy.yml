name: Deploy no Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Publica o site E as regras do Firestore (firestore.rules).
      # As regras exigem login para ler/escrever o banco — publique junto
      # com o commit que atualiza o app para não travar usuários.
      - name: Instalar Firebase CLI e Fazer Deploy
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting,firestore:rules --token "${{ secrets.FIREBASE_TOKEN }}"
