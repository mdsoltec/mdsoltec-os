<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#040705">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=20261007-2">
  <title>Nova OS - MDSoltec OS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="script.js?v=20261007-2"></script>
</head>
<body data-page="nova-os">
  <div class="app-shell">
    <aside class="app-sidebar">
      <a class="brand" href="index.html">
        <img src="/assets/nova_logo.webp" alt="MDSoltec" width="116" height="116">
        <span>MDSoltec OS</span>
      </a>
      <nav class="side-nav" aria-label="Navegação principal">
        <a class="side-link" data-route="index.html" href="index.html">Dashboard</a>
        <a class="side-link" data-route="nova-os.html" href="nova-os.html">Nova OS</a>
        <a class="side-link" data-route="listar-os.html" href="listar-os.html">Ordens de Serviço</a>
        <a class="side-link" data-route="clientes.html" href="clientes.html">Clientes</a>
        <a class="side-link" data-route="estoque.html" href="estoque.html">Estoque</a>
        <a class="side-link" data-route="pdv.html" href="pdv.html">PDV</a>
        <a class="side-link" data-route="financeiro.html" href="financeiro.html">Financeiro</a>
        <a class="side-link" data-route="relatorios.html" href="relatorios.html">Relatórios</a>
        <a class="side-link" data-route="garantias.html" href="garantias.html">Garantias</a>
        <a class="side-link" data-route="mensagens.html" href="mensagens.html">Mensagens</a>
        <a class="side-link" data-route="ficha-tecnica.html" href="ficha-tecnica.html">Ficha Técnica</a>
        <a class="side-link" data-route="configuracoes.html" href="configuracoes.html">Configurações</a>
      </nav>
      <div class="sidebar-footer">
        <a class="support-button" href="mailto:mdsoltec@gmail.com">Suporte</a>
        <div class="app-version">MDSoltec OS 1.0.0<br>© 2026 MDSoltec</div>
      </div>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <div class="nav-strip">
          <button id="novaOS" type="button" class="top-action">Nova OS</button>
          <button id="listOS" type="button" class="top-action">Listar OS</button>
          <button id="clienteID" type="button" class="top-action">Clientes</button>
          <button id="estoqueID" type="button" class="top-action">Estoque</button>
          <button id="pdvID" type="button" class="top-action">PDV</button>
          <button id="financeiroID" type="button" class="top-action">Financeiro</button>
        </div>
        <div class="user-menu">
          <span class="notification">3</span>
          <span class="avatar">A</span>
          <span class="user-copy"><strong>Admin</strong><small>Administrador</small></span>
        </div>
      </header>

      <section class="page">
        <div class="page-header">
          <h1>Nova Ordem de Serviço</h1>
          <a class="btn" href="listar-os.html">Ver OS</a>
        </div>

        <datalist id="clientes"></datalist>
        <datalist id="aparelhos"></datalist>
        <datalist id="tecnicos"></datalist>
        <datalist id="pecas"></datalist>

        <form id="osForm" class="form-panel">
          <div class="form-grid">
            <div class="field">
              <label for="clienteInput">Cliente</label>
              <input list="clientes" id="clienteInput" placeholder="Nome completo" required>
            </div>

            <div class="field">
              <label for="whatsappInput">WhatsApp</label>
              <input id="whatsappInput" placeholder="(48) 99999-9999">
            </div>

            <div class="field">
              <label for="clienteCpfCnpjInput">CPF/CNPJ</label>
              <input id="clienteCpfCnpjInput" placeholder="Documento do cliente">
            </div>

            <div class="field">
              <label for="clienteEnderecoInput">Endereço do cliente</label>
              <input id="clienteEnderecoInput" placeholder="Endereço cadastrado">
            </div>

            <div class="field">
              <label for="aparelhoInput">Equipamento</label>
              <input list="aparelhos" id="aparelhoInput" placeholder="Celular, notebook, tablet..." required>
            </div>

            <div class="field">
              <label for="marcaModeloInput">Marca / Modelo</label>
              <input id="marcaModeloInput" placeholder="Samsung A12, iPhone 11...">
            </div>

            <div class="field">
              <label for="imeiInput">IMEI / Serial</label>
              <input id="imeiInput" placeholder="Número de série ou IMEI">
            </div>

            <div class="field">
              <label for="statusID">Status</label>
              <select id="statusID" required>
                <option value="Recebido">Recebido</option>
                <option value="Em diagnóstico">Em diagnóstico</option>
                <option value="Aguardando aprovação">Aguardando aprovação</option>
                <option value="Em reparo">Em reparo</option>
                <option value="Aguardando peça">Aguardando peça</option>
                <option value="Pronto para retirada">Pronto para retirada</option>
                <option value="Finalizado">Finalizado</option>
                <option value="Sem reparo">Sem reparo</option>
              </select>
            </div>

            <div class="field">
              <label for="garantiaOS">Garantia</label>
              <select id="garantiaOS">
                <option value="">Usar padrão</option>
                <option value="30">30 dias</option>
                <option value="90">90 dias</option>
                <option value="180">180 dias</option>
              </select>
            </div>

            <div class="field form-row-full">
              <label for="descricaoProblema">Defeito relatado</label>
              <textarea id="descricaoProblema" placeholder="Descreva o problema informado pelo cliente" required></textarea>
            </div>

            <div class="field form-row-full">
              <label for="estadoFisicoInput">Estado físico e acessórios</label>
              <textarea id="estadoFisicoInput" placeholder="Tela trincada, tampa riscada, carregador, chip, capinha..."></textarea>
            </div>

            <div class="field">
              <label for="valorPecaInput">Valor da peça</label>
              <input id="valorPecaInput" inputmode="decimal" placeholder="R$ 0,00">
            </div>

            <div class="field">
              <label for="maoObraInput">Mão de obra</label>
              <input id="maoObraInput" inputmode="decimal" placeholder="R$ 0,00">
            </div>

            <input type="hidden" id="tecnicoInput" value="Admin">
            <input type="hidden" id="pecasInput">
            <input type="hidden" id="valorTotal">

            <div class="form-actions">
              <button type="submit" class="btn btn-primary btn-block">Salvar OS</button>
              <button id="gerarEntradaPdfBtn" type="button" class="btn btn-secondary btn-block">Gerar PDF de entrada</button>
              <button id="imprimirEntradaBtn" type="button" class="btn btn-secondary btn-block">Imprimir entrada</button>
              <button type="reset" class="btn btn-secondary btn-block">Limpar</button>
            </div>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
