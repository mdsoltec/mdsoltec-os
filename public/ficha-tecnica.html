<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <title>Ficha Técnica - MDSoltec OS</title>
  <script type="module" src="script.js?v=20260616-16"></script>
</head>
<body data-page="ficha-tecnica">
  <div class="app-shell">
    <aside class="app-sidebar">
      <a class="brand" href="index.html"><img src="/assets/nova_logo.png" alt="MDSoltec"><span>MDSoltec OS</span></a>
      <nav class="side-nav" aria-label="Navegação principal">
        <a class="side-link" data-route="index.html" href="index.html">Dashboard</a>
        <a class="side-link" data-route="nova-os.html" href="nova-os.html">Nova OS</a>
        <a class="side-link" data-route="listar-os.html" href="listar-os.html">Ordens de Serviço</a>
        <a class="side-link" data-route="clientes.html" href="clientes.html">Clientes</a>
        <a class="side-link" data-route="estoque.html" href="estoque.html">Estoque</a>
        <a class="side-link" data-route="pdv.html" href="pdv.html">PDV</a>
        <a class="side-link" data-route="financeiro.html" href="financeiro.html">Financeiro</a>
        <a class="side-link" data-route="relatorios.html" href="relatorios.html">Relatórios</a>
        <a class="side-link" data-route="garantias.html" href="garantias.html">Garantias</a>
        <a class="side-link" data-route="mensagens.html" href="mensagens.html">Mensagens</a>
        <a class="side-link" data-route="ficha-tecnica.html" href="ficha-tecnica.html">Ficha Técnica</a>
        <a class="side-link" data-route="configuracoes.html" href="configuracoes.html">Configurações</a>
      </nav>
      <div class="sidebar-footer"><a class="support-button" href="mailto:mdsoltec@gmail.com">Suporte</a><div class="app-version">MDSoltec OS 1.0.0<br>© 2026 MDSoltec</div></div>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <div class="nav-strip">
          <button id="novaOS" type="button" class="top-action">Nova OS</button>
          <button id="listOS" type="button" class="top-action">Listar OS</button>
          <button id="clienteID" type="button" class="top-action">Clientes</button>
          <button id="estoqueID" type="button" class="top-action">Estoque</button>
          <button id="pdvID" type="button" class="top-action">PDV</button>
          <button id="financeiroID" type="button" class="top-action">Financeiro</button>
        </div>
        <div class="user-menu"><span class="notification">3</span><span class="avatar">A</span><span class="user-copy"><strong>Admin</strong><small>Administrador</small></span></div>
      </header>

      <section class="page">
        <div class="page-header">
          <h1>Ficha Técnica</h1>
          <button type="submit" form="technicalForm" class="btn">+ Novo modelo</button>
        </div>
        <form id="technicalForm" class="form-panel">
          <div class="form-grid">
            <div class="field">
              <label for="marcaFicha">Marca</label>
              <input id="marcaFicha" placeholder="Samsung" required>
            </div>
            <div class="field">
              <label for="modeloFicha">Modelo</label>
              <input id="modeloFicha" placeholder="A12" required>
            </div>
            <div class="field form-row-full">
              <label for="defeitosFicha">Defeitos comuns</label>
              <textarea id="defeitosFicha" placeholder="Conector de carga, tela, bateria, curto na linha principal..."></textarea>
            </div>
            <div class="field form-row-full">
              <label for="solucoesFicha">Soluções registradas</label>
              <textarea id="solucoesFicha" placeholder="Procedimentos técnicos, medições, observações e peças compatíveis."></textarea>
            </div>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
