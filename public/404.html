<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#040705">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <title>Página não encontrada - MDSoltec OS</title>
  <style>
    :root { color-scheme: dark; }
    body {
      background: #040705; color: #f6fff8; min-height: 100vh; margin: 0;
      display: grid; place-items: center;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .card {
      background: #0b100d; border: 1px solid #29322c; border-radius: 12px;
      padding: 40px 36px; max-width: 380px; text-align: center;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.36);
    }
    .code { font-size: 44px; font-weight: 800; color: #00f03d; letter-spacing: 2px; margin: 0; }
    h1 { font-size: 18px; margin: 10px 0 8px; }
    p { color: #9aa8a0; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
    a {
      display: inline-block; background: #00f03d; color: #040705; font-weight: 700;
      text-decoration: none; padding: 12px 28px; border-radius: 8px; font-size: 14px;
    }
    a:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço acessado não existe no MDSoltec OS. Ele pode ter sido digitado errado ou a página foi movida.</p>
    <a href="/index.html">Ir para o Dashboard</a>
  </main>
</body>
</html>
