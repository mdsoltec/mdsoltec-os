<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Acesso ao MDSoltec OS — gestão de assistência técnica: ordens de serviço, clientes, estoque e PDV.">
  <meta name="theme-color" content="#040705">
  <meta name="description" content="Acesso ao MDSoltec OS — gestão de assistência técnica: ordens de serviço, clientes, estoque e PDV.">
  <meta name="theme-color" content="#040705">
  <meta name="theme-color" content="#040705">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=20261007-3">
  <title>Login - MDSoltec OS</title>
  <script type="module" src="script.js?v=20261007-3"></script>
  <style>
    .login-reset {
      margin-top: 10px; background: none; border: none; cursor: pointer;
      color: #9aa8a0; font: inherit; font-size: 13px; text-decoration: underline;
      text-underline-offset: 3px;
    }
    .login-reset:hover { color: #00f03d; }
  </style>
  <style>
    .login-reset {
      margin-top: 10px; background: none; border: none; cursor: pointer;
      color: #9aa8a0; font: inherit; font-size: 13px; text-decoration: underline;
      text-underline-offset: 3px;
    }
    .login-reset:hover { color: #00f03d; }
  </style>
</head>
<body data-page="login">
  <main class="login-page">
    <form id="loginForm" class="login-card">
      <div class="login-brand">
        <img src="/assets/nova_logo.webp" alt="MDSoltec" width="116" height="116">
        <h1>MDSoltec OS</h1>
        <p>Gestão de assistência técnica</p>
      </div>

      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input id="loginEmail" type="email" autocomplete="email">
      </div>

      <div class="field">
        <label for="loginSenha">Senha</label>
        <input id="loginSenha" type="password" autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      <button type="button" id="loginReset" class="login-reset">Esqueci minha senha</button>
      <small id="loginStatus" class="field-status" role="alert"></small>
    </form>
  </main>
</body>
</html>
