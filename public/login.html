<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#040705">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=20261007-1">
  <title>Login - MDSoltec OS</title>
  <script type="module" src="script.js?v=20261007-1"></script>
</head>
<body data-page="login">
  <main class="login-page">
    <form id="loginForm" class="login-card">
      <div class="login-brand">
        <img src="/assets/nova_logo.webp" alt="MDSoltec" width="116" height="116">
        <h1>MDSoltec OS</h1>
        <p>Gestão de assistência técnica</p>
      </div>

      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input id="loginEmail" type="email" autocomplete="email">
      </div>

      <div class="field">
        <label for="loginSenha">Senha</label>
        <input id="loginSenha" type="password" autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      <small id="loginStatus" class="field-status"></small>
    </form>
  </main>
</body>
</html>
